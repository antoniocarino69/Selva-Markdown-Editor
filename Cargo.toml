[package]
name = "markdown_notes"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "selva"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
egui_commonmark = "0.16"
syntect = "5.2"
walkdir = "2.5"
open = "5.1"
log = "0.4"
env_logger = "0.11"
rfd = "0.14"
arboard = "3.4"
regex = "1.10"
chrono = "0.4"
image = "0.25"

[build-dependencies]
winres = "0.1.12"

